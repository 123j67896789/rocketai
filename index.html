<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Moon Rocket AI — Daylight Sky to Space</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/@liquid-carrot/carrot/dist/carrot.umd.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; }
    #hud {
      position: absolute; top: 16px; left: 16px; color: #0f172a;
      background: rgba(255, 255, 255, 0.85); padding: 14px 18px;
      border-radius: 10px; border: 1px solid rgba(15, 23, 42, 0.15);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12); backdrop-filter: blur(8px);
    }
    h3 { margin: 0 0 8px 0; font-size: 16px; color: #0369a1; }
    .stat { font-size: 14px; margin: 4px 0; color: #334155; }
    .val { font-weight: 700; color: #0f172a; }
    .controls { margin-top: 10px; display: flex; gap: 8px; }
    button {
      background: #0284c7; color: white; border: none; padding: 7px 14px;
      border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.15s;
    }
    button:hover { background: #0369a1; }
    .hint { font-size: 12px; color: #64748b; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="hud">
    <h3>3D Moon Rocket AI</h3>
    <div class="stat">Generation: <span id="gen" class="val">1</span></div>
    <div class="stat">Landed: <span id="landed" class="val">0</span> / 35</div>
    <div class="stat">Closest Approach: <span id="dist" class="val">--</span> m</div>
    <div class="controls">
      <button id="speedBtn" onclick="toggleSpeed()">Speed: 1x</button>
      <button onclick="resetCamera()">Reset View</button>
    </div>
    <div class="hint">Left-drag: Orbit • Right-drag: Pan • Scroll: Zoom</div>
  </div>

  <script>
    const { Neat, architect } = carrot;

    // --- SIMULATION SETTINGS ---
    const POP_SIZE = 35;
    const LIFESPAN = 280;
    const GRAVITY = -0.012;
    const THRUST_POWER = 0.045;
    const ROT_SPEED = 0.06;
    const BOUNDS = 110;

    let generation = 1;
    let frame = 0;
    let simSpeed = 1;
    let rockets = [];

    function toggleSpeed() {
      simSpeed = simSpeed === 1 ? 4 : simSpeed === 4 ? 10 : 1;
      document.getElementById('speedBtn').textContent = `Speed: ${simSpeed}x`;
    }

    // --- THREE.JS SCENE & ATMOSPHERIC SKY DOME ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x93c5fd, 0.0022);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1200);
    function resetCamera() {
      camera.position.set(0, 12, 105);
      controls.target.set(0, 5, 0);
    }

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    resetCamera();

    // Custom Gradient Sky Dome (Warm Horizon -> Crisp Blue -> Deep Upper Atmosphere)
    const skyCanvas = document.createElement('canvas');
    skyCanvas.width = 16;
    skyCanvas.height = 256;
    const skyCtx = skyCanvas.getContext('2d');
    const skyGrad = skyCtx.createLinearGradient(0, 0, 0, 256);
    skyGrad.addColorStop(0.0, '#0f172a'); // High altitude twilight blue
    skyGrad.addColorStop(0.35, '#1d4ed8'); // Upper sky blue
    skyGrad.addColorStop(0.65, '#60a5fa'); // Mid sky blue
    skyGrad.addColorStop(1.0, '#e0f2fe'); // Bright horizon mist
    skyCtx.fillStyle = skyGrad;
    skyCtx.fillRect(0, 0, 16, 256);

    const skyTex = new THREE.CanvasTexture(skyCanvas);
    const skyDome = new THREE.Mesh(
      new THREE.SphereGeometry(500, 32, 32),
      new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false })
    );
    scene.add(skyDome);

    // --- LIGHTING ---
    const hemiLight = new THREE.HemisphereLight(0xe0f2fe, 0x3f6212, 0.9);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfffbeb, 1.6);
    sunLight.position.set(70, 110, 60);
    sunLight.castShadow = true;
    scene.add(sunLight);

    // --- ROLLING TERRAIN & LAUNCHPAD ---
    const groundGeo = new THREE.PlaneGeometry(600, 600, 48, 48);
    groundGeo.rotateX(-Math.PI / 2);
    const posAttr = groundGeo.attributes.position;
    for (let i = 0; i < posAttr.count; i++) {
      const x = posAttr.getX(i);
      const z = posAttr.getZ(i);
      // Flatten area near the launchpad (-28, 0), add rolling hills elsewhere
      const distFromPad = Math.hypot(x + 28, z);
      const hill = distFromPad > 18 ? (Math.sin(x * 0.05) * Math.cos(z * 0.05) * 4.5) : 0;
      posAttr.setY(i, -38 + hill);
    }
    groundGeo.computeVertexNormals();

    const groundMat = new THREE.MeshStandardMaterial({ color: 0x4d7c0f, roughness: 0.9, metalness: 0.05 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.receiveShadow = true;
    scene.add(ground);

    // Concrete Launchpad & Tower
    const pad = new THREE.Mesh(
      new THREE.CylinderGeometry(8, 10, 1.5, 24),
      new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.7 })
    );
    pad.position.set(-28, -37.2, 0);
    pad.receiveShadow = true;
    scene.add(pad);

    const tower = new THREE.Mesh(
      new THREE.BoxGeometry(1.4, 11, 1.4),
      new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.5 })
    );
    tower.position.set(-32, -31.5, 0);
    scene.add(tower);

    // --- FLUFFY 3D CLOUDS ---
    const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95, transparent: true, opacity: 0.88 });
    function spawnCloud(x, y, z, scale) {
      const group = new THREE.Group();
      for (let i = 0; i < 5; i++) {
        const puff = new THREE.Mesh(new THREE.DodecahedronGeometry(3.5, 1), cloudMat);
        puff.position.set((i - 2) * 2.8, Math.sin(i) * 1.2, (i % 2) * 1.8);
        puff.scale.setScalar(0.8 + Math.random() * 0.6);
        group.add(puff);
      }
      group.position.set(x, y, z);
      group.scale.setScalar(scale);
      scene.add(group);
    }
    spawnCloud(-45, 5, -25, 1.4);
    spawnCloud(0, 14, -35, 1.7);
    spawnCloud(45, -2, -20, 1.2);
    spawnCloud(-10, -10, -40, 1.5);

    // --- PROCEDURAL CRATERED 3D MOON ---
    const MOON_POS = new THREE.Vector3(34, 34, -14);
    const MOON_RADIUS = 7.0;

    // Generate procedural crater texture on an offscreen canvas
    const moonCanvas = document.createElement('canvas');
    moonCanvas.width = 512;
    moonCanvas.height = 256;
    const mCtx = moonCanvas.getContext('2d');
    mCtx.fillStyle = '#e2e8f0';
    mCtx.fillRect(0, 0, 512, 256);
    for (let i = 0; i < 65; i++) {
      const cx = Math.random() * 512;
      const cy = Math.random() * 256;
      const cr = 3 + Math.random() * 16;
      mCtx.beginPath();
      mCtx.arc(cx, cy, cr, 0, Math.PI * 2);
      mCtx.fillStyle = 'rgba(100, 116, 139, 0.25)';
      mCtx.fill();
      mCtx.lineWidth = 1.5;
      mCtx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
      mCtx.stroke();
    }
    const moonTex = new THREE.CanvasTexture(moonCanvas);

    const moonMesh = new THREE.Mesh(
      new THREE.SphereGeometry(MOON_RADIUS, 36, 36),
      new THREE.MeshStandardMaterial({ map: moonTex, bumpMap: moonTex, bumpScale: 0.25, roughness: 0.85 })
    );
    moonMesh.position.copy(MOON_POS);
    scene.add(moonMesh);

    // Target Ring
    const ringMesh = new THREE.Mesh(
      new THREE.RingGeometry(MOON_RADIUS + 1.2, MOON_RADIUS + 1.7, 36),
      new THREE.MeshBasicMaterial({ color: 0x0284c7, side: THREE.DoubleSide, transparent: true, opacity: 0.5 })
    );
    ringMesh.position.copy(MOON_POS);
    scene.add(ringMesh);

    // --- CARROT.JS NEAT ENGINE ---
    const neat = new Neat(9, 3, null, {
      population_size: POP_SIZE,
      elitism: 5,
      mutation_rate: 0.3,
      mutation_amount: 2,
      network: new architect.Perceptron(9, 12, 3)
    });

    const norm = (v, min, max) => Math.max(0, Math.min(1, (v - min) / (max - min)));

    // --- 3D ROCKET CLASS (Multi-part Geometry) ---
    class Rocket3D {
      constructor(brain) {
        this.brain = brain;
        this.vel = new THREE.Vector3(0, 0, 0);
        this.crashed = false;
        this.landed = false;
        this.closestDist = Infinity;

        this.mesh = new THREE.Group();

        // Fuselage
        this.bodyMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.35, roughness: 0.25 });
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.55, 2.8, 16), this.bodyMat);
        body.castShadow = true;

        // Nose Cone
        const nose = new THREE.Mesh(
          new THREE.ConeGeometry(0.45, 1.15, 16),
          new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.35 })
        );
        nose.position.y = 1.97;

        // Engine Nozzle
        const nozzle = new THREE.Mesh(
          new THREE.CylinderGeometry(0.28, 0.42, 0.5, 12),
          new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.8, roughness: 0.3 })
        );
        nozzle.position.y = -1.6;

        // 3 Delta Fins
        const finGeo = new THREE.BoxGeometry(0.1, 0.9, 0.75);
        const finMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.4 });
        for (let i = 0; i < 3; i++) {
          const fin = new THREE.Mesh(finGeo, finMat);
          const angle = (i * Math.PI * 2) / 3;
          fin.position.set(Math.sin(angle) * 0.55, -0.95, Math.cos(angle) * 0.55);
          fin.rotation.y = angle;
          this.mesh.add(fin);
        }

        // Thruster Exhaust Plume
        const flameGeo = new THREE.ConeGeometry(0.38, 1.7, 10);
        flameGeo.rotateX(Math.PI);
        this.flame = new THREE.Mesh(flameGeo, new THREE.MeshBasicMaterial({ color: 0xf97316 }));
        this.flame.position.y = -2.5;
        this.flame.visible = false;

        this.mesh.add(body, nose, nozzle, this.flame);
        this.mesh.position.set(-28, -34.5, 0);
        scene.add(this.mesh);
      }

      update() {
        if (this.crashed || this.landed) {
          this.flame.visible = false;
          return;
        }

        const pos = this.mesh.position;
        const rot = this.mesh.rotation;

        const inputs = [
          norm(MOON_POS.x - pos.x, -110, 110),
          norm(MOON_POS.y - pos.y, -110, 110),
          norm(MOON_POS.z - pos.z, -110, 110),
          norm(this.vel.x, -3, 3),
          norm(this.vel.y, -3, 3),
          norm(this.vel.z, -3, 3),
          norm(rot.x, -Math.PI, Math.PI),
          norm(rot.z, -Math.PI, Math.PI),
          norm(rot.y, -Math.PI, Math.PI)
        ];

        const [thrustOut, pitchOut, yawOut] = this.brain.activate(inputs);

        this.mesh.rotateX((pitchOut - 0.5) * 2 * ROT_SPEED);
        this.mesh.rotateZ((yawOut - 0.5) * 2 * ROT_SPEED);

        if (thrustOut > 0.5) {
          const forward = new THREE.Vector3(0, 1, 0).applyQuaternion(this.mesh.quaternion);
          this.vel.addScaledVector(forward, THRUST_POWER);
          this.flame.visible = true;
          this.flame.scale.y = 0.8 + Math.random() * 0.5; // Flickering flame effect
        } else {
          this.flame.visible = false;
        }

        this.vel.y += GRAVITY;
        pos.add(this.vel);

        const dist = pos.distanceTo(MOON_POS);
        if (dist < this.closestDist) this.closestDist = dist;

        if (dist <= MOON_RADIUS + 1.4) {
          this.landed = true;
          this.bodyMat.color.setHex(0x22c55e);
        } else if (pos.y < -36.5 || Math.abs(pos.x) > BOUNDS || pos.y > BOUNDS || Math.abs(pos.z) > BOUNDS) {
          this.crashed = true;
          this.bodyMat.color.setHex(0x94a3b8);
        }
      }

      destroy() {
        scene.remove(this.mesh);
      }
    }

    // --- EVOLUTION LOOP ---
    function startGeneration() {
      rockets.forEach(r => r.destroy());
      rockets = neat.population.map(brain => new Rocket3D(brain));
      frame = 0;
    }

    async function endGeneration() {
      let landedCount = 0;
      let bestDist = Infinity;

      for (const r of rockets) {
        if (r.landed) landedCount++;
        if (r.closestDist < bestDist) bestDist = r.closestDist;

        r.brain.score = 1 / (r.closestDist + 0.1);
        if (r.landed) r.brain.score *= 12;
        if (r.crashed) r.brain.score *= 0.25;
      }

      document.getElementById('gen').textContent = generation;
      document.getElementById('landed').textContent = landedCount;
      document.getElementById('dist').textContent = bestDist.toFixed(1);

      await neat.evolve();
      generation++;
      startGeneration();
    }

    // --- RENDER LOOP ---
    async function animate() {
      requestAnimationFrame(animate);

      for (let s = 0; s < simSpeed; s++) {
        let allDone = true;
        for (const r of rockets) {
          r.update();
          if (!r.crashed && !r.landed) allDone = false;
        }

        frame++;
        if (frame >= LIFESPAN || allDone) {
          await endGeneration();
          break;
        }
      }

      moonMesh.rotation.y += 0.002;
      ringMesh.lookAt(camera.position);
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    startGeneration();
    animate();
  </script>
</body>
</html>
