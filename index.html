<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Moon Rocket Neuroevolution (Three.js + Carrot.js)</title>
  <!-- Three.js & OrbitControls via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- Carrot.js Neuroevolution via CDN -->
  <script src="https://unpkg.com/@liquid-carrot/carrot/dist/carrot.umd.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    #hud {
      position: absolute; top: 16px; left: 16px; color: #f8fafc;
      background: rgba(15, 23, 42, 0.75); padding: 14px 18px;
      border-radius: 8px; border: 1px solid #334155; backdrop-filter: blur(6px);
      pointer-events: auto;
    }
    h3 { margin: 0 0 8px 0; font-size: 16px; color: #38bdf8; }
    .stat { font-size: 14px; margin: 4px 0; color: #cbd5e1; }
    .val { font-weight: bold; color: #fff; }
    .controls { margin-top: 10px; display: flex; gap: 8px; align-items: center; }
    button {
      background: #0284c7; color: white; border: none; padding: 6px 12px;
      border-radius: 4px; cursor: pointer; font-weight: 600;
    }
    button:hover { background: #0369a1; }
    .hint { font-size: 12px; color: #94a3b8; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="hud">
    <h3>3D Moon Rocket AI</h3>
    <div class="stat">Generation: <span id="gen" class="val">1</span></div>
    <div class="stat">Landed: <span id="landed" class="val">0</span> / 35</div>
    <div class="stat">Closest Approach: <span id="dist" class="val">--</span> m</div>
    <div class="controls">
      <button id="speedBtn" onclick="toggleSpeed()">Speed: 1x</button>
    </div>
    <div class="hint">Drag to rotate camera • Scroll to zoom</div>
  </div>

  <script>
    const { Neat, architect } = carrot;

    // --- SIMULATION SETTINGS ---
    const POP_SIZE = 35;
    const LIFESPAN = 280;
    const GRAVITY = -0.012;
    const THRUST_POWER = 0.045;
    const ROT_SPEED = 0.06;
    const BOUNDS = 90;

    let generation = 1;
    let frame = 0;
    let simSpeed = 1;
    let rockets = [];

    function toggleSpeed() {
      simSpeed = simSpeed === 1 ? 4 : simSpeed === 4 ? 10 : 1;
      document.getElementById('speedBtn').textContent = `Speed: ${simSpeed}x`;
    }

    // --- THREE.JS 3D SCENE SETUP ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 15, 95);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Lighting (Sun + Ambient)
    const ambientLight = new THREE.AmbientLight(0x334155, 1.2);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 2.2);
    sunLight.position.set(80, 100, 60);
    scene.add(sunLight);

    // Starfield Background
    const starGeo = new THREE.BufferGeometry();
    const starVertices = [];
    for (let i = 0; i < 1500; i++) {
      starVertices.push(
        (Math.random() - 0.5) * 600,
        (Math.random() - 0.5) * 600,
        (Math.random() - 0.5) * 600
      );
    }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
    const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.7 });
    scene.add(new THREE.Points(starGeo, starMat));

    // Launchpad Base
    const padGeo = new THREE.CylinderGeometry(8, 10, 1.5, 24);
    const padMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.6, roughness: 0.4 });
    const launchpad = new THREE.Mesh(padGeo, padMat);
    launchpad.position.set(-25, -35, 0);
    scene.add(launchpad);

    // Target Moon
    const MOON_POS = new THREE.Vector3(30, 32, -15);
    const MOON_RADIUS = 6.5;
    const moonGeo = new THREE.SphereGeometry(MOON_RADIUS, 32, 32);
    const moonMat = new THREE.MeshStandardMaterial({
      color: 0xe2e8f0,
      roughness: 0.85,
      metalness: 0.1
    });
    const moonMesh = new THREE.Mesh(moonGeo, moonMat);
    moonMesh.position.copy(MOON_POS);
    scene.add(moonMesh);

    // Subtle Target Beacon Ring around the Moon
    const ringGeo = new THREE.RingGeometry(MOON_RADIUS + 1.2, MOON_RADIUS + 1.6, 32);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide, transparent: true, opacity: 0.4 });
    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
    ringMesh.position.copy(MOON_POS);
    scene.add(ringMesh);

    // --- CARROT.JS NEAT ENGINE ---
    // 9 Inputs: dx, dy, dz, vx, vy, vz, pitch, yaw, roll
    // 3 Outputs: thrust, pitchControl, yawControl
    const neat = new Neat(9, 3, null, {
      population_size: POP_SIZE,
      elitism: 5,
      mutation_rate: 0.3,
      mutation_amount: 2,
      network: new architect.Perceptron(9, 12, 3)
    });

    const norm = (v, min, max) => Math.max(0, Math.min(1, (v - min) / (max - min)));

    // --- 3D ROCKET CLASS ---
    class Rocket3D {
      constructor(brain) {
        this.brain = brain;
        this.vel = new THREE.Vector3(0, 0, 0);
        this.crashed = false;
        this.landed = false;
        this.closestDist = Infinity;

        // Build 3D Rocket Mesh Group (Cone Nose + Cylinder Body + Exhaust Flame)
        this.mesh = new THREE.Group();

        const bodyGeo = new THREE.CylinderGeometry(0.45, 0.55, 2.6, 12);
        this.bodyMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, metalness: 0.4, roughness: 0.3 });
        const body = new THREE.Mesh(bodyGeo, this.bodyMat);

        const noseGeo = new THREE.ConeGeometry(0.45, 1.1, 12);
        const noseMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.4 });
        const nose = new THREE.Mesh(noseGeo, noseMat);
        nose.position.y = 1.85;

        const flameGeo = new THREE.ConeGeometry(0.4, 1.4, 8);
        flameGeo.rotateX(Math.PI);
        const flameMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });
        this.flame = new THREE.Mesh(flameGeo, flameMat);
        this.flame.position.y = -1.9;
        this.flame.visible = false;

        this.mesh.add(body, nose, this.flame);
        this.mesh.position.set(-25, -32.5, 0);
        scene.add(this.mesh);
      }

      update() {
        if (this.crashed || this.landed) {
          this.flame.visible = false;
          return;
        }

        const pos = this.mesh.position;
        const rot = this.mesh.rotation;

        // 1. Gather 3D Sensor Inputs
        const inputs = [
          norm(MOON_POS.x - pos.x, -100, 100),
          norm(MOON_POS.y - pos.y, -100, 100),
          norm(MOON_POS.z - pos.z, -100, 100),
          norm(this.vel.x, -3, 3),
          norm(this.vel.y, -3, 3),
          norm(this.vel.z, -3, 3),
          norm(rot.x, -Math.PI, Math.PI),
          norm(rot.z, -Math.PI, Math.PI),
          norm(rot.y, -Math.PI, Math.PI)
        ];

        // 2. Neural Network Decision
        const [thrustOut, pitchOut, yawOut] = this.brain.activate(inputs);

        // 3. Apply 3D Rotation (Pitch & Roll/Yaw)
        this.mesh.rotateX((pitchOut - 0.5) * 2 * ROT_SPEED);
        this.mesh.rotateZ((yawOut - 0.5) * 2 * ROT_SPEED);

        // 4. Apply Forward Thrust along Rocket's Local Up (+Y) Axis
        if (thrustOut > 0.5) {
          const forward = new THREE.Vector3(0, 1, 0).applyQuaternion(this.mesh.quaternion);
          this.vel.addScaledVector(forward, THRUST_POWER);
          this.flame.visible = true;
        } else {
          this.flame.visible = false;
        }

        // 5. Apply Gravity & Update Position
        this.vel.y += GRAVITY;
        pos.add(this.vel);

        // Track Closest Distance to Moon
        const dist = pos.distanceTo(MOON_POS);
        if (dist < this.closestDist) this.closestDist = dist;

        // Check Landing or Out-of-Bounds Crash
        if (dist <= MOON_RADIUS + 1.2) {
          this.landed = true;
          this.bodyMat.color.setHex(0x4ade80);
        } else if (Math.abs(pos.x) > BOUNDS || Math.abs(pos.y) > BOUNDS || Math.abs(pos.z) > BOUNDS) {
          this.crashed = true;
          this.bodyMat.color.setHex(0x64748b);
        }
      }

      destroy() {
        scene.remove(this.mesh);
      }
    }

    // --- EVOLUTION LOOP ---
    function startGeneration() {
      rockets.forEach(r => r.destroy());
      rockets = neat.population.map(brain => new Rocket3D(brain));
      frame = 0;
    }

    async function endGeneration() {
      let landedCount = 0;
      let bestDist = Infinity;

      for (const r of rockets) {
        if (r.landed) landedCount++;
        if (r.closestDist < bestDist) bestDist = r.closestDist;

        r.brain.score = 1 / (r.closestDist + 0.1);
        if (r.landed) r.brain.score *= 12;
        if (r.crashed) r.brain.score *= 0.25;
      }

      document.getElementById('gen').textContent = generation;
      document.getElementById('landed').textContent = landedCount;
      document.getElementById('dist').textContent = bestDist.toFixed(1);

      await neat.evolve();
      generation++;
      startGeneration();
    }

    // --- RENDER LOOP ---
    async function animate() {
      requestAnimationFrame(animate);

      for (let s = 0; s < simSpeed; s++) {
        let allDone = true;
        for (const r of rockets) {
          r.update();
          if (!r.crashed && !r.landed) allDone = false;
        }

        frame++;
        if (frame >= LIFESPAN || allDone) {
          await endGeneration();
          break;
        }
      }

      moonMesh.rotation.y += 0.002;
      ringMesh.lookAt(camera.position);
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    startGeneration();
    animate();
  </script>
</body>
</html>
